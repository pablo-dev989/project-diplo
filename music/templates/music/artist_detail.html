{% extends 'music/base.html' %}

{% block body %}
    <h1>Artista</h1>
    <form action="{% url 'artist_detail' artist.id %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Guardar">
    </form>
    <ul>
        {% for album in artist.album_set.all %}
        <li>{{ album.name }} - {{ album.pub_date}}</li>
        {% endfor %}
    </ul>
{% endblock %}
